<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Novated Lease Decision Tool (Australia)</title>
  <style>
    :root {
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --border: #e5e7eb;
      --bg: #f9fafb;
      --text-muted: #6b7280;
      --card-bg: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,0.06);
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 980px;
      margin: 2rem auto;
      padding: 0 1rem 3rem;
      background: var(--bg);
      color: #111827;
    }
    h1 { font-size: 1.8rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    h3 { font-size: 1.05rem; margin: 0 0 0.4rem; }
    .section {
      margin: 1.25rem 0;
      padding: 1rem 1.1rem;
      border-radius: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    label {
      display: block;
      margin: 0.4rem 0 0.1rem;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input, select {
      width: 100%;
      padding: 0.35rem 0.45rem;
      box-sizing: border-box;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      background: #fff;
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    .result-row {
      display: flex;
      justify-content: space-between;
      margin: 0.18rem 0;
      font-size: 0.92rem;
    }
    .result-label { font-weight: 600; }
    .muted { color: var(--text-muted); font-size: 0.85rem; }
    button {
      margin-top: 0.8rem;
      padding: 0.5rem 1.1rem;
      cursor: pointer;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
    }
    button:hover { background: #1d4ed8; }
    hr {
      margin: 0.6rem 0;
      border: none;
      border-top: 1px solid #e5e7eb;
    }
    .pill {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #1d4ed8;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .highlight {
      background: #ecfdf3;
      border-color: #bbf7d0;
    }
    .highlight .result-label { color: #166534; }
    @media (max-width: 780px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Novated Lease Decision Tool (Australia)</h1>
  <p class="muted">
    Stage 3 tax rates + 2% Medicare. No offsets, HECS, or detailed FBT modelling. EV FBT exemption approximated. Guidance only.
  </p>

  <!-- Workplace & Income -->
  <div class="section">
    <h2>Workplace & Income <span class="pill">Step 1</span></h2>
    <div class="grid">
      <div>
        <label for="workplaceType">Workplace type</label>
        <select id="workplaceType" onchange="recalc()">
          <option value="nfp">NFP / PBI (caps for other benefits)</option>
          <option value="gov">Government / Health / Education</option>
          <option value="corp">Corporate / Private</option>
          <option value="custom">Custom caps (enter below)</option>
        </select>

        <label for="salary">Base salary (package)</label>
        <input id="salary" type="number" value="80000" oninput="recalc()">

        <label for="otherIncome">Other income (shares, property, etc.)</label>
        <input id="otherIncome" type="number" value="20000" oninput="recalc()">
      </div>

      <div>
        <label for="packCap">Salary packaging cap (custom only)</label>
        <input id="packCap" type="number" value="15900" oninput="recalc()">

        <label for="meCap">Meals & entertainment cap (custom only)</label>
        <input id="meCap" type="number" value="2650" oninput="recalc()">

        <label for="ecmToggle">ECM (Employee Contribution Method)</label>
        <select id="ecmToggle" onchange="recalc()">
          <option value="auto">Auto (use ECM for non‑EVs, not for EVs)</option>
          <option value="forceOn">
