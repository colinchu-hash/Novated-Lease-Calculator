<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Novated Lease Calculator</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
    }
    .card {
        background: white;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }
    .highlight {
        background-color: #dcfce7 !important;
        box-shadow: 0 0 12px rgba(34,197,94,0.4) !important;
        transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input, select {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 16px;
    }
    .hidden { display: none; }
    .slide {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.25s ease;
    }
    .slide.open {
        max-height: 500px;
    }
</style>
</head>

<body>

<h1>Novated Lease Calculator</h1>

<!-- CURRENT CAR CARD -->
<div class="card" id="currentCarCard">
    <h2>Current Car</h2>

    <label>Fuel per year ($)</label>
    <input type="number" id="fuel" />

    <label>Rego per year ($)</label>
    <input type="number" id="rego" />

    <label>Servicing per year ($)</label>
    <input type="number" id="service" />

    <label>Current car ownership</label>
    <select id="ownership">
        <option value="paid">Fully paid off</option>
        <option value="loan">Loan / finance</option>
        <option value="lease">Private lease</option>
    </select>

    <div id="loanRow">
        <label id="loanLabel">Loan repayments per year ($)</label>
        <input type="number" id="loan" />
    </div>

    <label>
        <input type="checkbox" id="depToggle" /> Include depreciation in comparison
    </label>

    <div id="depSection" class="slide">
        <label>Original purchase price ($)</label>
        <input type="number" id="origCost" />

        <label>Current market value ($)</label>
        <input type="number" id="currValue" />

        <label>Age of vehicle (years)</label>
        <input type="number" id="age" />

        <label>Expected remaining life (years)</label>
        <input type="number" id="life" />
    </div>
</div>

<!-- NOVATED LEASE CARD -->
<div class="card">
    <h2>Novated Lease</h2>

    <label>Lease cost per week ($)</label>
    <input type="number" id="leaseWeekly" />

    <label>Lease cost per year ($)</label>
    <input type="number" id="leaseCost" />

    <label>Running costs inside lease per year ($)</label>
    <input type="number" id="runCost" />

    <label>Is this an EV?</label>
    <select id="isEV">
        <option value="no">No</option>
        <option value="yes">Yes</option>
    </select>

    <label>ECM mode</label>
    <select id="ecmMode">
        <option value="auto">Auto</option>
        <option value="forceOn">Force ECM On</option>
        <option value="forceOff">Force ECM Off</option>
    </select>
</div>

<!-- COMPARISON CARD -->
<div class="card">
    <h2>Comparison</h2>
    <p><strong>Current car annual cost:</strong> <span id="currentCost">$0</span></p>
    <p><strong>Novated lease annual cost:</strong> <span id="leaseOut">$0</span></p>
    <p><strong>Difference:</strong> <span id="diff">$0</span></p>
</div>

<script>
function recalc() {
    let fuel = +fuelInput.value || 0;
    let rego = +regoInput.value || 0;
    let service = +serviceInput.value || 0;

    let ownership = ownershipSel.value;
    let loan = +loanInput.value || 0;

    let depOn = depToggle.checked;
    let dep = 0;

    if (depOn) {
        let currValue = +currValueInput.value || 0;
        let life = +lifeInput.value || 1;
        dep = currValue / life;
    }

    let currentCost = fuel + rego + service + dep;
    if (ownership !== "paid") currentCost += loan;

    let leaseCost = +leaseAnnual.value || 0;
    let runCost = +runCostInput.value || 0;
    let isEV = isEVSel.value;

    let leaseOut = leaseCost + runCost;
    if (isEV === "yes") leaseOut *= 0.7;

    currentCostOut.innerText = `$${currentCost.toFixed(0)}`;
    leaseOutOut.innerText = `$${leaseOut.toFixed(0)}`;
    diffOut.innerText = `$${(leaseOut - currentCost).toFixed(0)}`;
}

/* ELEMENTS */
const fuelInput = document.getElementById("fuel");
const regoInput = document.getElementById("rego");
const serviceInput = document.getElementById("service");
const ownershipSel = document.getElementById("ownership");
const loanRow = document.getElementById("loanRow");
const loanLabel = document.getElementById("loanLabel");
const loanInput = document.getElementById("loan");

const depToggle = document.getElementById("depToggle");
const depSection = document.getElementById("depSection");
const currentCarCard = document.getElementById("currentCarCard");

const origCostInput = document.getElementById("origCost");
const currValueInput = document.getElementById("currValue");
const ageInput = document.getElementById("age");
const lifeInput = document.getElementById("life");

const leaseWeekly = document.getElementById("leaseWeekly");
const leaseAnnual = document.getElementById("leaseCost");
const runCostInput = document.getElementById("runCost");
const isEVSel = document.getElementById("isEV");
const ecmModeSel = document.getElementById("ecmMode");

const currentCostOut = document.getElementById("currentCost");
const leaseOutOut = document.getElementById("leaseOut");
const diffOut = document.getElementById("diff");

/* OWNERSHIP LOGIC */
ownershipSel.addEventListener("change", () => {
    if (ownershipSel.value === "paid") {
        loanRow.classList.add("hidden");
    } else {
        loanRow.classList.remove("hidden");
        loanLabel.innerText =
            ownershipSel.value === "loan"
                ? "Loan repayments per year ($)"
                : "Private lease payments per year ($)";
    }
    recalc();
});

/* DEPRECIATION TOGGLE + GLOW */
function removeGlow() {
    currentCarCard.classList.remove("highlight");
    document.removeEventListener("click", removeGlow);
}

depToggle.addEventListener("change", () => {
    if (depToggle.checked) {
        depSection.classList.add("open");
        currentCarCard.classList.add("highlight");

        setTimeout(() => {
            document.addEventListener("click", removeGlow);
        }, 50);
    } else {
        depSection.classList.remove("open");
        currentCarCard.classList.remove("highlight");
    }
    recalc();
});

/* WEEKLY ↔ ANNUAL SYNC */
leaseWeekly.addEventListener("input", () => {
    if (leaseWeekly.value) {
        leaseAnnual.value = (leaseWeekly.value * 52).toFixed(0);
    }
    recalc();
});

leaseWeekly.addEventListener("focus", () => {
    leaseAnnual.value = "";
});

leaseAnnual.addEventListener("input", () => {
    if (leaseAnnual.value) {
        leaseWeekly.value = (leaseAnnual.value / 52).toFixed(2);
    }
    recalc();
});

leaseAnnual.addEventListener("focus", () => {
    leaseWeekly.value = "";
});

/* RECALC ON ALL INPUTS */
document.querySelectorAll("input, select").forEach(el => {
    el.addEventListener("input", recalc);
    el.addEventListener("change", recalc);
});
</script>

</body>
</html>
